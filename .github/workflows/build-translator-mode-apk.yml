name: Build Translator Mode APK

on:
  push:
    branches: [main]
    paths:
      - 'Translator Mode/**'
      - '.github/workflows/build-translator-mode-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter toolchain
        run: flutter --version

      - name: Bootstrap Translator Mode
        working-directory: Translator Mode
        run: |
          chmod +x scripts/bootstrap_platforms.sh
          ./scripts/bootstrap_platforms.sh

      - name: Build release APK
        working-directory: Translator Mode
        run: flutter build apk --release

      - name: Verify APK
        working-directory: Translator Mode
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matuk-translator-mode-apk
          path: Translator Mode/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
