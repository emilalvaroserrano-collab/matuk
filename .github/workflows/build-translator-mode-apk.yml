name: Build Translator Mode APK

on:
  push:
    branches: [main]
    paths:
      - 'Translator Mode/**'
      - '.github/workflows/build-translator-mode-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter toolchain
        run: flutter --version

      - name: Bootstrap Translator Mode
        working-directory: Translator Mode
        run: |
          chmod +x scripts/bootstrap_platforms.sh
          ./scripts/bootstrap_platforms.sh

      - name: Build release APK
        working-directory: Translator Mode
        run: flutter build apk --release

      - name: Verify APK
        working-directory: Translator Mode
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matuk-translator-mode-apk
          path: Translator Mode/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release asset
        run: |
          cp "Translator Mode/build/app/outputs/flutter-apk/app-release.apk" matuk-translator-mode-v0.1.0.apk
          sha256sum matuk-translator-mode-v0.1.0.apk > matuk-translator-mode-v0.1.0.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="translator-mode-v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              matuk-translator-mode-v0.1.0.apk \
              matuk-translator-mode-v0.1.0.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              matuk-translator-mode-v0.1.0.apk \
              matuk-translator-mode-v0.1.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "Translator Mode v0.1.0" \
              --notes "First Android release of Matuk Translator Mode. Local-first dual translator using Gemma 3 1B, offline Sherpa STT, and Supertonic 3 TTS. Models are prepared on first run."
          fi
