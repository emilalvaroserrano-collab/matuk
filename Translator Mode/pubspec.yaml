name: matuk_translator_mode
description: Standalone local dual translator using Eb Translator, Speech Recognition, and Speech Synthesys.
publish_to: "none"
version: 1.1.4+9

environment:
  sdk: ">=3.10.1 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  crypto: ^3.0.6
  http: ^1.5.0
  llama_cpp_flutter: ^0.8.0
  llama_flutter_android: ^0.2.6
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  sherpa_onnx: 1.13.7
  whisper_cpp_flutter_plus: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
